<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cine Sofá</title>
<link rel="manifest" href="/manifest.json">
<meta property="og:title" content="Cine Sofá - assista com os amigos">
<meta property="og:description" content="Entre na sala e veja o filme junto com a galera.">
<meta property="og:image" content="__ORIGIN__/icon-512.png">
<meta property="og:type" content="website">
<meta name="theme-color" content="#09090F">
<link rel="icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#09090F;--panel:#12121C;--card:#191927;--line:#2a2a40;--ink:#F8FAFC;--mute:#9292A5;--lamp:#8B5CF6;--blue:#5865F2;--hi:#B49CFB;--red:#b4233a;--nl:68%}
html[data-theme=azul]{--bg:#070d1f;--panel:#0e1730;--card:#14203f;--line:#243461;--lamp:#3b82f6;--hi:#7fb0ff}
html[data-theme=claro]{--bg:#f5f4fb;--panel:#fff;--card:#fff;--line:#ddd8ee;--ink:#17141f;--mute:#6a6580;--lamp:#6d3fe0;--hi:#5b34c2;--nl:36%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,"Segoe UI",system-ui,sans-serif}
.hide{display:none!important}
i{display:inline-flex;font-style:normal}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
button{font:inherit;color:#fff;background:linear-gradient(135deg,var(--lamp),var(--blue));border:0;border-radius:10px;padding:.6em 1.05em;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .15s,filter .15s,border-color .15s}
button:hover{filter:brightness(1.12);transform:translateY(-1px)}
button.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
button.sec:hover{border-color:var(--lamp)}
button:disabled{opacity:.4;cursor:not-allowed;transform:none}
input,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.6em .8em;width:100%}
select{width:auto}input:focus{border-color:var(--lamp)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01s!important}}
/* ---- pagina inicial ---- */
#lobby{min-height:100vh;background:radial-gradient(60% 50% at 15% 0,#8b5cf633,transparent),radial-gradient(45% 45% at 90% 8%,#5865f233,transparent)}
#nav{display:flex;align-items:center;gap:16px;padding:12px clamp(16px,4vw,48px);border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);position:sticky;top:0;z-index:10}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.15rem}.logo svg{color:var(--lamp)}
.search{flex:1;max-width:380px;margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 .7em;color:var(--mute)}
.search input{border:0;background:transparent;padding:.55em 0}
.pill{font-size:.8rem;padding:.25em .75em;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.pill.on{color:#4ade80}
.pill.load{background:linear-gradient(90deg,var(--card) 25%,var(--line) 50%,var(--card) 75%);background-size:200% 100%;animation:sk 1.4s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.hero{padding:clamp(32px,8vw,88px) clamp(16px,4vw,48px) 28px;max-width:1100px;margin:auto}
.hero h1{font-size:clamp(2.2rem,6vw,4rem);line-height:1.05;margin:0 0 .4em;letter-spacing:-.03em}
.hero h1 span{background:linear-gradient(90deg,var(--hi),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mute);max-width:46ch;margin:0 0 1.5em;font-size:1.1rem}
.form{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;max-width:560px;display:grid;gap:12px;box-shadow:0 20px 60px #8b5cf622}
.form label{display:block;color:var(--mute);font-size:.85rem}.form label input{margin-top:4px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
.rail,.muted{max-width:1100px;margin:auto;padding:16px clamp(16px,4vw,48px)}
.muted{color:var(--mute)}
.rail h2{font-size:1.05rem;display:flex;align-items:center;gap:8px;margin:0 0 12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.rc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;transition:transform .2s,border-color .2s}
.rc:hover{transform:translateY(-3px);border-color:var(--lamp)}
.rc b{display:block;overflow-wrap:anywhere}.rc small{color:var(--mute)}
.rb{display:flex;gap:6px;align-items:center}.rb .go{margin-left:auto}
.ic{background:transparent;color:var(--ink);border:1px solid var(--line);padding:.4em;border-radius:8px}
/* ---- sala ---- */
#room{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding:16px;min-height:100vh;max-width:1500px;margin:auto}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.top b{font-weight:700;font-size:1.25rem}.top span{color:var(--mute)}.top .sp{flex:1}
.stage{position:relative;background:#000;border-radius:16px;overflow:hidden;aspect-ratio:16/9;display:grid;place-items:center;border:1px solid var(--line);box-shadow:0 20px 60px #8b5cf626}
.stage video{width:100%;height:100%;background:#000}
#ytbox{width:100%;height:100%}#ytbox iframe{width:100%;height:100%;border:0}
.empty{color:#9292A5;padding:24px;text-align:center}
#reacts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
#reacts button{background:var(--card);border:1px solid var(--line);font-size:1.3rem;padding:.3em .6em;color:var(--ink)}
#reacts button.sf{font-size:.9rem}
#tabs{display:flex;gap:4px;margin-top:12px;border-bottom:1px solid var(--line);overflow-x:auto}
#tabs button{background:transparent;color:var(--mute);border-radius:8px 8px 0 0;padding:.5em .9em;white-space:nowrap}
#tabs button.on{color:var(--ink);box-shadow:inset 0 -3px 0 var(--lamp)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.note{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--lamp)}
.note div,#quick div,#recap div{margin-top:6px}
aside{background:var(--panel);border-radius:16px;display:flex;flex-direction:column;height:calc(100vh - 32px);border:1px solid var(--line);position:sticky;top:16px}
#who{padding:12px 14px;border-bottom:1px solid var(--line);color:var(--mute);font-size:.9rem}
#log{flex:1;overflow:auto;padding:12px 14px}
#log p{margin:0 0 .6em;overflow-wrap:anywhere}#log i{color:var(--mute)}
#log mark{background:var(--lamp);color:#fff;border-radius:4px;padding:0 .2em}
#chat{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;padding:.6em 1em;border-radius:10px;z-index:50}
#acct{display:flex;gap:8px;align-items:center}
#modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:16px;z-index:60}
.mbox{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;width:min(520px,100%);max-height:90vh;overflow:auto}
#mclose{position:absolute;top:10px;right:10px}
.mbox h3{margin:0 40px 12px 0}.mbox label{display:block;color:var(--mute);font-size:.85rem;margin-bottom:10px}.mbox label input,.mbox textarea{margin-top:4px}
textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:.6em .8em;width:100%;resize:vertical}
.err{color:#ff8a9b;min-height:1.2em;margin:.4em 0}.small{color:var(--mute);font-size:.8rem;display:block;margin:6px 0}
.avs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.avs button{font-size:1.3rem;padding:.2em .4em}
.avs button.on{border-color:var(--lamp);box-shadow:0 0 0 2px var(--lamp)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 14px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;font-size:.8rem;color:var(--mute);text-align:center}.stats b{display:block;font-size:1.3rem;color:var(--ink)}
.mt{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.mt .sec.on{background:linear-gradient(135deg,var(--lamp),var(--blue));color:#fff;border-color:transparent}
.hl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.hl small{color:var(--mute)}
button.danger{background:var(--red)}
a.btn{display:inline-flex;align-items:center;justify-content:center;padding:.6em 1.05em;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600}
.x{padding:0 .4em;background:transparent;border:1px solid var(--line);color:var(--ink);font-size:.8rem;border-radius:6px}
.fl{position:absolute;bottom:8%;font-size:2.2rem;animation:up 2.5s ease-out forwards;pointer-events:none}
@keyframes up{to{transform:translateY(-70%);opacity:0}}
#ov{position:absolute;left:10px;bottom:10px;max-width:65%;pointer-events:none;display:flex;flex-direction:column;gap:4px;text-align:left}
#ov p{margin:0;background:#000c;color:#fff;padding:.2em .6em;border-radius:6px;font-size:.95rem}
#brk{font-size:1.2rem;text-align:center}#brk b{font-size:2rem}
#bingo .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
#bingo .c{background:var(--bg);border:1px solid var(--line);color:var(--ink);font-size:.8rem;padding:.5em;min-height:3.4em;font-weight:400}
#bingo .c.on{background:var(--lamp);color:#fff}
.cine aside,.cine .top{display:none}.cine #room{grid-template-columns:1fr}.cine .stage{max-height:82vh;margin:auto}
@media (pointer:coarse){button,select,input{min-height:44px}#tabs button{padding:.7em 1.1em}#reacts button{padding:.4em .8em}.x{min-height:38px;min-width:38px}}
@media(max-width:860px){
#room{display:flex;flex-direction:column;gap:10px;padding:10px}
#room>section{display:contents}
.stage{position:sticky;top:0;z-index:20;border-radius:12px}
aside{position:static;height:auto;min-height:55vh}#log{max-height:45vh}
.tools button,.tools select{flex:1 1 45%}
#nav{flex-wrap:wrap}.search{order:3;max-width:none;flex-basis:100%;margin-left:0}}
</style>
</head>
<body>

<div id="lobby">
  <header id="nav">
    <div class="logo"><i data-ic="film"></i> Cine Sofá</div>
    <label class="search"><i data-ic="search"></i><input id="find" placeholder="Buscar nas suas salas" aria-label="Buscar nas suas salas"></label>
    <span id="conn" class="pill load">Conectando ao servidor…</span>
    <div id="acct" class="hide"></div>
  </header>
  <section class="hero">
    <h1>Cinema com os amigos,<br><span>cada um no seu sofá.</span></h1>
    <p>Vídeo sincronizado, chat, áudio e reações. Crie uma sala e mande o link.</p>
    <div class="form">
      <label>Seu nome<input id="name" maxlength="24" autocomplete="nickname"></label>
      <label>Código da sala<input id="code" maxlength="30" placeholder="ex.: noite-de-filme"></label>
      <label>Senha da sala (opcional)<input id="pass" maxlength="30" autocomplete="off"></label>
      <div class="row">
        <button id="enter"><i data-ic="arrow"></i> Entrar na sala</button>
        <button id="create" class="sec"><i data-ic="plus"></i> Criar sala nova</button>
      </div>
    </div>
  </section>
  <section id="favs" class="rail hide"><h2><i data-ic="star"></i> Favoritas</h2><div class="cards"></div></section>
  <section id="recent" class="rail hide"><h2>Salas recentes</h2><div class="cards"></div></section>
  <p id="homeEmpty" class="muted"></p>
</div>

<div id="room" class="hide">
  <section>
    <div class="top">
      <b id="roomName"></b><span id="count"></span><span class="sp"></span>
      <button id="bFav" class="sec ic" title="Favoritar sala" aria-label="Favoritar sala"></button>
      <button id="invite" class="sec"><i data-ic="link"></i> Copiar convite</button>
      <button id="bLeave" class="sec"><i data-ic="out"></i> Sair</button>
    </div>
    <div class="stage">
      <video id="v" controls playsinline class="hide"></video>
      <video id="s" autoplay playsinline controls class="hide"></video>
      <div id="ytbox" class="hide"><div id="ytdiv"></div></div>
      <div id="empty" class="empty">Nenhum vídeo ainda. Cole um link, escolha um arquivo ou compartilhe a tela.</div>
      <div id="ov"></div>
    </div>
    <div id="reacts"><button>😂</button><button>😱</button><button>❤️</button><button>👏</button><button>🔥</button><button class="sf" data-k="aplauso">🎉 Aplausos</button><button class="sf" data-k="suspense">😨 Suspense</button><button class="sf" data-k="sino">🔔 Sino</button></div>
    <div id="tabs"><button data-g="assistir" class="on">Assistir</button><button data-g="sala">Sala</button><button data-g="votos">Votações</button><button data-g="tela">Tela</button></div>
    <div class="tools" data-g="assistir">
      <button id="bLink">Colar link (YouTube ou .mp4)</button>
      <button id="bFile" class="sec">Escolher arquivo do PC</button>
      <button id="bCast" class="sec">Transmitir arquivo para todos</button>
      <button id="bShare" class="sec">Compartilhar tela</button>
      <button id="bQAdd" class="sec">Adicionar à fila</button>
      <button id="bQNext" class="sec">Próximo da fila</button>
      <button id="bSync" class="sec">Sincronizar todos comigo</button>
      <button id="bSrt" class="sec">Legendas (.srt)</button>
      <select id="qual" title="Qualidade da transmissão"><option value="auto">Qualidade: automática</option><option value="3000">Alta</option><option value="1500">Média</option><option value="800">Leve</option></select>
    </div>
    <div class="tools hide" data-g="sala">
      <button id="bLock" class="sec hide">Só eu controlo</button>
      <button id="bBreak" class="sec">Intervalo</button>
      <button id="bSched" class="sec">Agendar sessão</button>
      <button id="bCount" class="sec">Contagem para dar play</button>
      <button id="bVoice" class="sec">Entrar no áudio</button>
      <button id="bMic" class="sec hide">🎙️ Microfone: mutado</button>
      <button id="bRecap" class="sec hide">Resumo da noite</button>
    </div>
    <div class="tools hide" data-g="votos">
      <button id="bSug" class="sec">Sugerir filme</button>
      <button id="bQuick" class="sec">Enquete rápida</button>
      <button id="bBet" class="sec hide">Palpite</button>
      <button id="bBingo" class="sec">Bingo de clichês</button>
    </div>
    <div class="tools hide" data-g="tela">
      <button id="bCine" class="sec">Modo cinema</button>
      <button id="bFull" class="sec">Tela cheia</button>
      <button id="bOv" class="sec">Chat no vídeo</button>
      <button id="bTheme" class="sec">Mudar tema</button>
    </div>
    <div id="note" class="note hide"></div>
    <div id="poll" class="note hide"></div>
    <div id="queue" class="note hide"></div>
    <div id="brk" class="note hide"></div>
    <div id="quick" class="note hide"></div>
    <div id="bingo" class="note hide"></div>
    <div id="recap" class="note hide"></div>
    <input id="file" type="file" accept="video/*" class="hide">
    <input id="castfile" type="file" accept="video/*" class="hide">
    <input id="srt" type="file" accept=".srt" class="hide">
  </section>
  <aside>
    <div id="who"></div>
    <div id="log" aria-live="polite"></div>
    <form id="chat"><input id="msg" placeholder="Escreva uma mensagem" autocomplete="off"><button>Enviar</button></form>
  </aside>
</div>

<div id="toast" class="hide" role="status"></div>
<div id="modal" class="hide"><div class="mbox" role="dialog" aria-modal="true"><button class="ic" id="mclose" aria-label="Fechar">✕</button><div id="mbody"></div></div></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = id => document.getElementById(id);
const sock = io();
const v = $('v'), scr = $('s');
const lag = new Set(), muted = new Set(), vin = new Set(), meta = {};
let joinedOnce = false, joinInfo = null;
let hostId = null, locked = false, users = {}, peers = {}, stream = null, applying = false, wantFile = false, pendingCtl = null, room = '';

function toast(t) {
  const e = $('toast'); e.textContent = t; e.classList.remove('hide');
  clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.add('hide'), 3500);
}
function note(html) { const n = $('note'); if (!html) return n.classList.add('hide'); n.innerHTML = html; n.classList.remove('hide'); }
function log(html) { const l = $('log'); l.insertAdjacentHTML('beforeend', '<p>' + html + '</p>'); l.scrollTop = l.scrollHeight; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------- Entrada ---------- */
const qs = new URLSearchParams(location.search);
$('code').value = qs.get('sala') || '';
$('name').value = localStorage.getItem('cs-name') || '';
const slug = () => Math.random().toString(36).slice(2, 7);
$('create').onclick = () => { $('code').value = slug(); join(); };
$('enter').onclick = join;
function join() {
  const name = $('name').value.trim(), code = $('code').value.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9_-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 30);
  if (!name) { $('name').focus(); return toast('Digite seu nome'); }
  if (!code) { $('code').focus(); return toast('Digite o código da sala'); }
  try { localStorage.setItem('cs-name', name); } catch (e) {}
  room = code;
  history.replaceState(null, '', '?sala=' + encodeURIComponent(code));
  joinInfo = { room: code, name, pass: $('pass').value }; sock.emit('join', joinInfo);
}

sock.on('joined', ({ id, state, users: list, host, locked: lk, chat, queue, poll, quick: qk, voice }) => {
  joinedOnce = true; (voice || []).forEach(i => vin.add(i));
  hostId = host; locked = lk; $('log').innerHTML = ''; (chat || []).forEach(showMsg); renderQueue(queue || []); renderPoll(poll || []); renderQuick(qk);
  users = {}; list.forEach(u => { users[u.id] = u.name; meta[u.id] = { av: u.av, acct: u.acct }; });
  $('lobby').classList.add('hide'); $('room').classList.remove('hide');
  $('roomName').textContent = 'Sala ' + room; remember(room); syncFav();
  renderUsers(); applyLock();
  if (state && state.src) { pendingCtl = state; applySource(state.src); }
  if (stream) { sock.emit('share-start'); Object.keys(users).forEach(i => i !== sock.id && call(i)); }
  if (mic) { vin.add(sock.id); sock.emit('voice-join'); }
});
$('invite').onclick = () => navigator.clipboard.writeText(location.origin + '/?sala=' + encodeURIComponent(room))
  .then(() => toast('Convite copiado. Mande para os amigos.'), () => toast('Copie o endereço da barra do navegador.'));

function renderUsers() {
  const me = sock.id === hostId, n = Object.keys(users).length;
  $('count').textContent = n + (n === 1 ? ' pessoa' : ' pessoas');
  $('who').innerHTML = Object.entries(users).map(([id, nm]) => (id === hostId ? '👑 ' : '') + (vin.has(id) ? '🎙️ ' : '') + (lag.has(id) ? '⚠️ ' : '') + (meta[id] && meta[id].av ? esc(meta[id].av) + ' ' : '') + esc(nm) + (meta[id] && meta[id].acct ? ' <small title="Conta cadastrada">✓</small>' : '') +
    (id !== sock.id ? ' <button class="x" data-m="' + esc(nm) + '" title="Silenciar no chat">' + (muted.has(nm) ? '🔈' : '🔇') + '</button>' : '') +
    (me && id !== sock.id ? ' <button class="x" data-h="' + id + '" title="Passar anfitrião">👑</button> <button class="x" data-id="' + id + '" title="Remover da sala">✕</button>' : '')).join(' · ');
}
$('who').onclick = e => {
  const b = e.target.closest('.x'); if (!b) return;
  if (b.dataset.m) { const nm = b.dataset.m; if (muted.has(nm)) muted.delete(nm); else muted.add(nm); renderUsers(); }
  else if (b.dataset.h) { if (confirm('Passar o anfitrião para esta pessoa?')) sock.emit('make-host', b.dataset.h); }
  else if (b.dataset.id && confirm('Remover esta pessoa da sala?')) sock.emit('kick', b.dataset.id);
};
sock.on('denied', why => { toast(why === 'limit' ? 'Muitas tentativas. Espere um minuto.' : 'Senha incorreta para esta sala.'); if (why !== 'limit') $('pass').focus(); });
sock.on('busy', () => toast('Esta sala (ou o servidor) está cheia no momento.'));
sock.on('bad-room', () => toast('Use só letras, números, - e _ no código da sala.'));
sock.on('error', () => toast('Calma! Muitas ações em pouco tempo.'));
sock.on('connect', () => { if (joinedOnce && joinInfo) { sock.emit('join', joinInfo); toast('Reconectado à sala.'); } });
sock.on('disconnect', () => { if (joinedOnce) toast('Conexão perdida. Tentando reconectar...'); });
sock.on('share-denied', () => { toast('Outra pessoa já está transmitindo, ou os controles estão bloqueados.'); stopShare(); });
sock.on('kicked', () => { alert('Você foi removido da sala.'); location.href = location.pathname; });
sock.on('user-joined', u => {

let ytp = null, mode = 'v', ytTimer = null, lastT = 0;
function showPlayer() {
  mode = 'v'; if (ytp && ytp.pauseVideo) ytp.pauseVideo();
  $('ytbox').classList.add('hide'); v.classList.remove('hide'); scr.classList.add('hide'); $('empty').classList.add('hide');
}
function loadYtApi(cb) {
  if (window.YT && YT.Player) return cb();
  if (!loadYtApi.q) {
    loadYtApi.q = [];
    const t = document.createElement('script'); t.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(t);
    window.onYouTubeIframeAPIReady = () => loadYtApi.q.forEach(f => f());
  }
  loadYtApi.q.push(cb);
}
const ytId = u => { const m = u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/); return m && m[1]; };
function showYt(id) {
  mode = 'yt'; v.pause(); v.classList.add('hide'); scr.classList.add('hide'); $('empty').classList.add('hide');
  $('ytbox').classList.remove('hide');
  loadYtApi(() => {
    if (ytp && ytp.cueVideoById) { ytp.cueVideoById(id); return; }
    ytp = new YT.Player('ytdiv', {
      videoId: id, playerVars: { playsinline: 1, rel: 0 },
      events: {
        onReady: () => { if (pendingCtl) { applyCtl(pendingCtl); pendingCtl = null; } },
        onStateChange: e => { if (e.data === 1) send('play'); else if (e.data === 2) send('pause'); else if (e.data === 0 && sock.id === hostId) sock.emit('queue-next'); },
      },
    });
    clearInterval(ytTimer);
    ytTimer = setInterval(() => {
      if (!ytp || !ytp.getCurrentTime) return;
      const t = ytp.getCurrentTime();
      if (Math.abs(t - lastT) > 2.5 && !applying) send('seek');
      lastT = t;
    }, 1000);
  });
}

function applySource(src) {

  } else if (src.kind === 'url') {

  } else {
    wantFile = true;
    note('Seu amigo escolheu o arquivo <b>' + esc(src.name) + '</b>. Escolha o mesmo arquivo no seu PC para assistirem juntos. <button id="pick">Escolher arquivo</button>');

function cur() {
  if (mode === 'yt' && ytp && ytp.getCurrentTime) return { t: ytp.getCurrentTime(), p: ytp.getPlayerState() === 1 };
  return { t: v.currentTime, p: !v.paused };
}
function send(type) {
  if (applying || fileCast || (mode === 'v' && !v.src)) return;
  const c = cur(); sock.emit('ctl', { playing: c.p, time: c.t, type });
}
v.onplay = () => send('play');
v.onpause = () => send('pause');
v.onseeked = () => send('seek');

function applyCtl(c) {
  applying = true;
  if (mode === 'yt' && ytp && ytp.seekTo) {
    if (Math.abs(ytp.getCurrentTime() - c.time) > 1.2) ytp.seekTo(c.time, true);
    if (c.playing) ytp.playVideo(); else ytp.pauseVideo();
    lastT = c.time;
  } else {
    if (Math.abs(v.currentTime - c.time) > 0.7) v.currentTime = c.time;
    if (c.playing) v.play().catch(() => toast('Clique no vídeo para liberar o play'));
    else v.pause();
  }
  setTimeout(() => applying = false, 800);
}
sock.on('ctl', c => {

});

    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.max(0, 1 - i / d.length) * (Math.random() < .02 ? 1 : .25);
    const n = a.createBufferSource(), f = a.createBiquadFilter(); n.buffer = b; f.type = 'bandpass'; f.frequency.value = 2500;

    if (k === 'sino') { o.frequency.value = 880; g.gain.setValueAtTime(.3, t); g.gain.exponentialRampToValueAtTime(.001, t + 2); o.stop(t + 2); }

/* ---------- Chat de voz (cada pessoa liga direto com as outras) ---------- */
const vpeers = {}; let mic = null;
function vdrop(id) {
  if (vpeers[id]) { vpeers[id].close(); delete vpeers[id]; }
  const a = document.getElementById('va-' + id); if (a) a.remove();
  vin.delete(id); renderUsers();
}
function vmk(id) {
  const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
  pc.onicecandidate = e => e.candidate && sock.emit('vsignal', { to: id, data: { ice: e.candidate } });
  pc.ontrack = e => {
    let a = document.getElementById('va-' + id);
    if (!a) { a = document.createElement('audio'); a.id = 'va-' + id; a.autoplay = true; document.body.appendChild(a); }
    a.srcObject = e.streams[0];
  };
  mic.getTracks().forEach(t => pc.addTrack(t, mic));
  vpeers[id] = pc; return pc;
}
async function vcall(id) {
  if (!mic) return;
  const pc = vmk(id), o = await pc.createOffer(); await pc.setLocalDescription(o);
  sock.emit('vsignal', { to: id, data: { sdp: pc.localDescription } });
}
sock.on('vsignal', async ({ from, data }) => {
  if (!mic) return;
  if (data.sdp) {
    if (data.sdp.type === 'offer') { if (vpeers[from]) vpeers[from].close(); vmk(from); }
    const pc = vpeers[from]; if (!pc) return;
    await pc.setRemoteDescription(data.sdp);
    if (data.sdp.type === 'offer') {
      const a = await pc.createAnswer(); await pc.setLocalDescription(a);
      sock.emit('vsignal', { to: from, data: { sdp: pc.localDescription } });
    }
  } else if (data.ice && vpeers[from]) { try { await vpeers[from].addIceCandidate(data.ice); } catch (e) {} }
});
function setMic(on) {
  if (!mic) return;
  mic.getAudioTracks().forEach(t => t.enabled = on);
  $('bMic').textContent = on ? '🎙️ Microfone: aberto' : '🎙️ Microfone: mutado';
}
function leaveVoice() {
  if (!mic) return;
  Object.keys(vpeers).forEach(id => { vpeers[id].close(); delete vpeers[id]; const a = document.getElementById('va-' + id); if (a) a.remove(); });
  mic.getTracks().forEach(t => t.stop()); mic = null; vin.delete(sock.id);
  sock.emit('voice-leave'); $('bMic').classList.add('hide'); $('bVoice').textContent = 'Entrar no áudio'; renderUsers();
}
$('bVoice').onclick = async () => {
  if (mic) return leaveVoice();
  try { mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, video: false }); }
  catch (e) { return toast('Não consegui acessar o microfone. Libere a permissão no navegador.'); }
  setMic(false); vin.add(sock.id); renderUsers();
  $('bMic').classList.remove('hide'); $('bVoice').textContent = 'Sair do áudio';
  sock.emit('voice-join'); toast(touch ? 'Use fones de ouvido. Toque em Microfone para falar.' : 'Use fones de ouvido. Segure a tecla V para falar.');
};
$('bMic').onclick = () => { if (mic) setMic(!mic.getAudioTracks()[0].enabled); };
sock.on('voice-list', ids => ids.forEach(vcall));
sock.on('voice-state', ({ id, on }) => { if (on) { vin.add(id); renderUsers(); } else vdrop(id); });

/* ---------- Celular e diagnostico de audio ---------- */
const touch = matchMedia('(pointer:coarse)').matches || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
const canShare = !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia);
const canCap = !!(HTMLMediaElement.prototype.captureStream || HTMLMediaElement.prototype.mozCaptureStream);
if (touch || !canShare) $('bShare').classList.add('hide');
if (touch || !canCap) $('bCast').classList.add('hide');
if ($('bShare').classList.contains('hide') && $('bCast').classList.contains('hide')) $('qual').classList.add('hide');
function checkAudio() {
  const none = v.webkitAudioDecodedByteCount === 0 || v.mozHasAudio === false;
  if (none && !v.paused && !v.muted && v.volume > 0 && v.currentTime > 2)
    note('⚠️ Este vídeo está tocando <b>sem som</b>. Se ele deveria ter áudio, o formato (comum: AC3, DTS ou E-AC3 em arquivos .mkv) não é suportado pelo navegador, e os amigos também não ouvem. Converta o áudio para AAC com o VLC ou o HandBrake, ou use outro arquivo.');
}
let chk = '';
v.addEventListener('playing', () => { if (chk === v.src) return; chk = v.src; setTimeout(checkAudio, 5000); });

/* ---------- Pagina inicial: icones, historico e favoritos (salvos so neste navegador) ---------- */
const ICONS = {
  film: '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18M3 7.5h4M3 12h18M3 16.5h4M17 3v18M17 7.5h4M17 16.5h4"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  star: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  out: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>',
  plus: '<path d="M5 12h14M12 5v14"/>',
  arrow: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
};
const ic = (n, fill) => '<svg width="18" height="18" viewBox="0 0 24 24" fill="' + (fill ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[n] + '</svg>';
document.querySelectorAll('[data-ic]').forEach(e => e.innerHTML = ic(e.dataset.ic));

const getRooms = () => { try { return JSON.parse(localStorage.getItem('cs-rooms')) || []; } catch (e) { return []; } };
const setRooms = a => { try { localStorage.setItem('cs-rooms', JSON.stringify(a.slice(0, 24))); } catch (e) {} };
function remember(code) {
  const old = getRooms().find(r => r.code === code);
  setRooms([{ code, last: Date.now(), fav: old ? old.fav : false }, ...getRooms().filter(r => r.code !== code)]);
}
function ago(t) {
  const m = Math.round((Date.now() - t) / 60000);
  return m < 1 ? 'agora há pouco' : m < 60 ? 'há ' + m + ' min' : m < 1440 ? 'há ' + Math.round(m / 60) + ' h' : 'há ' + Math.round(m / 1440) + ' d';
}
function renderHome() {
  const q = $('find').value.trim().toLowerCase(), all = getRooms(), list = all.filter(r => r.code.includes(q));
  const card = r => '<div class="rc"><div><b>' + esc(r.code) + '</b><small>' + (r.last ? ago(r.last) : 'favorita da conta') + '</small></div><div class="rb">' +
    '<button class="ic" data-fav="' + esc(r.code) + '" title="Favoritar" aria-label="Favoritar">' + ic('star', r.fav) + '</button>' +
    '<button class="ic" data-del="' + esc(r.code) + '" title="Remover do histórico" aria-label="Remover do histórico">' + ic('x') + '</button>' +
    '<button class="go" data-go="' + esc(r.code) + '">Entrar ' + ic('arrow') + '</button></div></div>';
  const fill = (id, arr) => { const el = $(id); el.classList.toggle('hide', !arr.length); el.querySelector('.cards').innerHTML = arr.map(card).join(''); };
  fill('favs', list.filter(r => r.fav)); fill('recent', list.filter(r => !r.fav));
  $('homeEmpty').classList.toggle('hide', !!list.length);
  $('homeEmpty').textContent = all.length ? 'Nenhuma sala encontrada para essa busca.' : 'As salas que você entrar aparecem aqui, só neste navegador.';
}
$('find').oninput = renderHome;
$('lobby').addEventListener('click', e => {
  const b = e.target.closest('[data-go],[data-fav],[data-del]'); if (!b) return;
  const a = getRooms();
  if (b.dataset.go) { $('code').value = b.dataset.go; if ($('name').value.trim()) join(); else { $('name').focus(); toast('Digite seu nome para entrar.'); } return; }
  if (b.dataset.fav) {
    const r = a.find(x => x.code === b.dataset.fav);
    if (r) { r.fav = !r.fav; if (AUTH.user) api(r.fav ? 'POST' : 'DELETE', '/api/me/favorites', { code: r.code }).catch(() => {}); }
    setRooms(a);
  }
  if (b.dataset.del) { if (AUTH.user) api('DELETE', '/api/me/favorites', { code: b.dataset.del }).catch(() => {}); setRooms(a.filter(x => x.code !== b.dataset.del)); }
  renderHome();
});
renderHome();

function syncFav() {
  const r = getRooms().find(x => x.code === room), on = !!(r && r.fav);
  $('bFav').innerHTML = ic('star', on); $('bFav').setAttribute('aria-pressed', String(on));
}
$('bFav').onclick = () => {
  const a = getRooms(), r = a.find(x => x.code === room); if (!r) return;
  r.fav = !r.fav; setRooms(a); syncFav();
  if (AUTH.user) api(r.fav ? 'POST' : 'DELETE', '/api/me/favorites', { code: r.code }).catch(() => {});
  toast(r.fav ? 'Sala adicionada aos favoritos.' : 'Sala removida dos favoritos.');
};
$('bLeave').onclick = () => { location.href = location.pathname; };

function setConn(st) {
  const c = $('conn'); c.className = 'pill ' + (st === 'on' ? 'on' : 'load');
  c.textContent = st === 'on' ? '● Online' : st === 'off' ? 'Reconectando…' : 'Conectando ao servidor…';
}
if (sock.connected) setConn('on');
sock.on('connect', () => setConn('on'));
sock.on('disconnect', () => setConn('off'));
setTimeout(() => { if (!sock.connected) $('conn').textContent = 'Acordando o servidor… pode levar até 1 minuto'; }, 6000);

/* ---------- Contas: cadastro, login, perfil, historico e favoritas ---------- */
const AUTH = { on: false, user: null, avatars: [] };
async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { 'Content-Type': 'application/json', 'X-CS': '1' }, body: body ? JSON.stringify(body) : undefined });
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(j.error || 'Erro ' + r.status);
  return j;
}
const reconnect = () => { sock.disconnect(); sock.connect(); };
const modal = h => { $('mbody').innerHTML = h; $('modal').classList.remove('hide'); };
const closeModal = () => $('modal').classList.add('hide');
$('mclose').onclick = closeModal;
$('modal').onclick = e => { if (e.target === $('modal')) closeModal(); };
addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function renderAcct() {
  const el = $('acct'); el.classList.toggle('hide', !AUTH.on);
  if (!AUTH.on) return;
  el.innerHTML = AUTH.user ? '<button class="sec" id="bProfile">' + esc(AUTH.user.avatar) + ' ' + esc(AUTH.user.username) + '</button>'
    : '<button class="sec" id="bLogin">Entrar</button><button id="bSignup">Criar conta</button>';
  $('name').readOnly = !!AUTH.user; if (AUTH.user) $('name').value = AUTH.user.username;
}
$('acct').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'bLogin') showAuth('login'); else if (b.id === 'bSignup') showAuth('reg'); else if (b.id === 'bProfile') showProfile('perfil');
};
function showAuth(mode) {
  const reg = mode === 'reg';
  modal('<h3>' + (reg ? 'Criar conta' : 'Entrar') + '</h3><form id="aform">' +
    (reg ? '<label>Nome de usuário<input name="username" maxlength="20" autocomplete="username" required></label><label>Email<input name="email" type="email" autocomplete="email" required></label>'
         : '<label>Usuário ou email<input name="login" autocomplete="username" required></label>') +
    '<label>Senha<input name="password" type="password" minlength="' + (reg ? 8 : 1) + '" maxlength="128" autocomplete="' + (reg ? 'new-password' : 'current-password') + '" required></label>' +
    (reg ? '<span class="small">Guardamos seu email e uma versão protegida da senha. No perfil você pode exportar ou excluir seus dados quando quiser.</span>' : '') +
    '<p class="err" id="merr" role="alert"></p><div class="row"><button>' + (reg ? 'Criar conta' : 'Entrar') + '</button><button type="button" class="sec" id="mswitch">' + (reg ? 'Já tenho conta' : 'Criar conta') + '</button></div></form>');
  $('mswitch').onclick = () => showAuth(reg ? 'login' : 'reg');
  $('aform').onsubmit = async e => {
    e.preventDefault();
    try {
      const r = await api('POST', reg ? '/api/register' : '/api/login', Object.fromEntries(new FormData(e.target)));
      AUTH.user = r.user; closeModal(); renderAcct(); reconnect(); await pullFavs(); toast('Olá, ' + r.user.username + '!');
    } catch (err) { $('merr').textContent = err.message; }
  };
  setTimeout(() => $('aform').querySelector('input').focus(), 0);
}
async function pullFavs() {
  try {
    const srv = (await api('GET', '/api/me/favorites')).rooms, a = getRooms();
    srv.forEach(c => { const r = a.find(x => x.code === c); if (r) r.fav = true; else a.push({ code: c, last: 0, fav: true }); });
    for (const r of a) if (r.fav && !srv.includes(r.code)) await api('POST', '/api/me/favorites', { code: r.code }).catch(() => {});
    setRooms(a); renderHome();
  } catch (e) {}
}
async function showProfile(tab) {
  let me; try { me = await api('GET', '/api/me'); } catch (e) { AUTH.user = null; renderAcct(); return showAuth('login'); }
  const u = me.user, st = me.stats, T = { perfil: 'Perfil', historico: 'Histórico', favoritas: 'Favoritas', conta: 'Conta' };
  const head = '<h3>' + esc(u.avatar) + ' ' + esc(u.username) + '</h3><div class="mt">' + Object.keys(T).map(t => '<button class="sec' + (t === tab ? ' on' : '') + '" data-t="' + t + '">' + T[t] + '</button>').join('') + '</div>';
  let body = '';
  if (tab === 'perfil') {
    body = '<div class="stats"><div><b>' + st.sessions + '</b>sessões</div><div><b>' + st.minutes + '</b>minutos</div><div><b>' + st.rooms + '</b>salas</div><div><b>' + st.messages + '</b>mensagens</div></div>' +
      '<form id="pform"><div class="avs" role="radiogroup" aria-label="Avatar">' + AUTH.avatars.map((a, i) => '<button type="button" class="sec' + (i === u.avatarIdx ? ' on' : '') + '" data-av="' + i + '" role="radio" aria-checked="' + (i === u.avatarIdx) + '">' + esc(a) + '</button>').join('') + '</div>' +
      '<label>Status<input name="status" maxlength="40" value="' + esc(u.status) + '" placeholder="ex.: maratonando séries"></label>' +
      '<label>Bio<textarea name="bio" rows="3" maxlength="160">' + esc(u.bio) + '</textarea></label><p class="err" id="merr"></p><button>Salvar perfil</button></form>';
  } else if (tab === 'historico') {
    const h = (await api('GET', '/api/me/history')).items;
    body = h.length ? h.map(x => { const m = x.left_at ? Math.max(1, Math.round((new Date(x.left_at) - new Date(x.joined_at)) / 60000)) : null;
      return '<div class="hl"><b>' + esc(x.room) + '</b><small>' + esc(new Date(x.joined_at).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })) + (m ? ' · ' + m + ' min' : '') + '</small></div>'; }).join('')
      : '<p class="small">Seu histórico aparece aqui depois da primeira sessão com a conta logada.</p>';
  } else if (tab === 'favoritas') {
    const f = (await api('GET', '/api/me/favorites')).rooms;
    body = f.length ? f.map(c => '<div class="hl"><b>' + esc(c) + '</b><span><button class="sec" data-go="' + esc(c) + '">Entrar</button> <button class="x" data-rm="' + esc(c) + '" aria-label="Remover">✕</button></span></div>').join('')
      : '<p class="small">Nenhuma sala favorita ainda. Use a estrela dentro da sala ou na página inicial.</p>';
  } else {
    body = '<p>Email: <b>' + esc(u.email) + '</b></p><p class="small">Conta criada em ' + esc(new Date(u.since).toLocaleDateString('pt-BR')) + '</p>' +
      '<div class="row"><a class="btn" href="/api/me/export" download>Exportar meus dados</a><button class="sec" id="bout">Sair da conta</button></div>' +
      '<p class="small" style="margin-top:18px">Excluir a conta apaga seu perfil, histórico e favoritas. Não dá para desfazer.</p><button class="danger" id="bdel">Excluir minha conta</button>';
  }
  modal(head + body);
  $('mbody').querySelectorAll('[data-t]').forEach(b => b.onclick = () => showProfile(b.dataset.t));
  if (tab === 'perfil') {
    let sel = u.avatarIdx;
    $('mbody').querySelectorAll('[data-av]').forEach(b => b.onclick = () => { sel = +b.dataset.av; $('mbody').querySelectorAll('[data-av]').forEach(x => x.classList.toggle('on', x === b)); });
    $('pform').onsubmit = async e => {
      e.preventDefault(); const f = Object.fromEntries(new FormData(e.target));
      try { AUTH.user = (await api('PATCH', '/api/me', { avatar: sel, bio: f.bio, status: f.status })).user; renderAcct(); reconnect(); toast('Perfil salvo.'); showProfile('perfil'); }
      catch (err) { $('merr').textContent = err.message; }
    };
  }
  if (tab === 'favoritas') {
    $('mbody').querySelectorAll('[data-go]').forEach(b => b.onclick = () => { closeModal(); $('code').value = b.dataset.go; join(); });
    $('mbody').querySelectorAll('[data-rm]').forEach(b => b.onclick = async () => {
      await api('DELETE', '/api/me/favorites', { code: b.dataset.rm }).catch(() => {});
      setRooms(getRooms().map(r => r.code === b.dataset.rm ? { ...r, fav: false } : r)); renderHome(); showProfile('favoritas');
    });
  }
  if (tab === 'conta') {
    $('bout').onclick = async () => { await api('POST', '/api/logout', {}).catch(() => {}); AUTH.user = null; $('name').value = ''; closeModal(); renderAcct(); reconnect(); toast('Você saiu da conta.'); };
    $('bdel').onclick = async () => {
      const pw = prompt('Digite sua senha para confirmar a exclusão da conta:'); if (!pw) return;
      try { await api('DELETE', '/api/me', { password: pw }); AUTH.user = null; $('name').value = ''; closeModal(); renderAcct(); reconnect(); toast('Conta excluída.'); }
      catch (err) { toast(err.message); }
    };
  }
}
(async () => {
  try {
    const c = await api('GET', '/api/config'); AUTH.on = c.accounts; AUTH.avatars = c.avatars;
    if (AUTH.on) { try { AUTH.user = (await api('GET', '/api/me')).user; } catch (e) {} }
  } catch (e) {}
  renderAcct(); if (AUTH.user) pullFavs();
})();

/* ---------- Transmitir arquivo (so o anfitriao precisa ter o filme) ---------- */
let fileCast = false;
$('bCast').onclick = () => {
  if (stream && fileCast) return stopShare();
  if (stream) return toast('Pare a tela compartilhada antes.');
  $('castfile').click();
};
$('castfile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  fileCast = true; v.src = URL.createObjectURL(f); showPlayer(); e.target.value = '';
  note('Dê play no vídeo para começar a transmitir. Seus amigos recebem imagem e som. Deixe esta aba aberta.');
  v.addEventListener('playing', () => {
    if (!fileCast || stream) return;
    stream = v.captureStream ? v.captureStream() : v.mozCaptureStream();
    sock.emit('share-start');
    $('bCast').textContent = 'Parar transmissão';
    note('Transmitindo para ' + (Object.keys(users).length - 1) + ' pessoa(s). Pausar, avançar e voltar aqui vale para todos.');
    let rn = null; const again = () => Object.keys(users).forEach(id => id !== sock.id && call(id));
    stream.onaddtrack = () => { clearTimeout(rn); rn = setTimeout(again, 400); };
    setTimeout(again, 600);
    setTimeout(() => { if (stream) note('Transmitindo para ' + (Object.keys(users).length - 1) + ' pessoa(s). ' +
      (stream.getAudioTracks().length ? '🔊 Áudio do arquivo capturado.' : '⚠️ O navegador NÃO capturou áudio deste arquivo (formato de áudio não suportado, comum em .mkv). Converta o áudio para AAC.')); }, 1500);
  }, { once: true });
};

/* ---------- Contagem para quem usa Netflix, Prime etc. na própria conta ---------- */
$('bCount').onclick = () => sock.emit('count');
sock.on('count', () => {
  let n = 5;
  const tick = () => {
    if (n > 0) { note('<b style="font-size:2rem">' + n + '</b> Deixe o filme pronto, com o play parado.'); n--; setTimeout(tick, 1000); }
    else { note('<b style="font-size:2rem">Dê play agora!</b>'); setTimeout(() => note(''), 3000); }
  };
  tick();
});

/* ---------- Tela compartilhada (WebRTC) ---------- */
async function setLocal(pc, d) {
  try {
    await pc.setLocalDescription({ type: d.type, sdp: d.sdp.replace(/a=fmtp:(\d+) ([^\r\n]*useinbandfec=1[^\r\n]*)/g, 'a=fmtp:$1 $2;stereo=1;sprop-stereo=1;maxaveragebitrate=128000') });
  } catch (e) { await pc.setLocalDescription(d); }
}
function mk(id) {
  const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
  pc.onicecandidate = e => e.candidate && sock.emit('signal', { to: id, data: { ice: e.candidate } });
  pc.ontrack = e => {
    scr.srcObject = e.streams[0];
    scr.classList.remove('hide'); v.classList.add('hide'); $('ytbox').classList.add('hide'); $('empty').classList.add('hide');
    v.pause(); if (ytp && ytp.pauseVideo) ytp.pauseVideo();
    scr.muted = false; scr.volume = 1;
    clearTimeout(mk.t); mk.t = setTimeout(() => {
      const st = scr.srcObject;
      if (st && !st.getAudioTracks().length) note('Chegou só a imagem, sem áudio. Avise quem está transmitindo.');
    }, 2500);
    const pl = scr.play(); if (pl && pl.catch) pl.catch(() => {
      note('O navegador bloqueou o som. <button id="unm">Ativar som</button>');
      $('unm').onclick = () => { scr.muted = false; scr.play(); note(''); };
    });
  };
  return pc;
}
async function call(id) {
  if (peers[id]) peers[id].close();
  const pc = peers[id] = mk(id);
  stream.getTracks().forEach(t => pc.addTrack(t, stream));
  const n = Object.keys(users).length;
  const q = $('qual').value, kbps = q === 'auto' ? (n <= 6 ? 3000 : n <= 11 ? 1500 : 800) : +q;
  pc.getSenders().forEach(s => {
    if (s.track && s.track.kind === 'video') {
      const p = s.getParameters(); if (!p.encodings || !p.encodings.length) p.encodings = [{}];
      p.encodings[0].maxBitrate = kbps * 1000;
      p.encodings[0].scaleResolutionDownBy = kbps >= 2500 ? 1 : kbps >= 1200 ? 1.5 : 2; s.setParameters(p).catch(() => {});
    }
  });
  const o = await pc.createOffer(); await setLocal(pc, o);
  sock.emit('signal', { to: id, data: { sdp: pc.localDescription } });
}
sock.on('signal', async ({ from, data }) => {
  if (data.sdp) {
    if (data.sdp.type === 'offer') { if (peers[from]) peers[from].close(); peers[from] = mk(from); }
    const pc = peers[from]; if (!pc) return;
    await pc.setRemoteDescription(data.sdp);
    if (data.sdp.type === 'offer') {
      const a = await pc.createAnswer(); await setLocal(pc, a);
      sock.emit('signal', { to: from, data: { sdp: pc.localDescription } });
    }
  } else if (data.ice && peers[from]) {
    try { await peers[from].addIceCandidate(data.ice); } catch (e) {}
  }
});
sock.on('share-stop', () => {
  scr.srcObject = null; scr.classList.add('hide');
  if (mode === 'yt') $('ytbox').classList.remove('hide');
  else if (v.src) v.classList.remove('hide'); else $('empty').classList.remove('hide');
});

$('bShare').onclick = async () => {
  if (stream) return stopShare();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) return toast('Seu navegador não permite compartilhar a tela aqui.');
  try { stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 30 }, audio: true }); }
  catch (e) { return; }
  sock.emit('share-start');
  stream.getVideoTracks()[0].onended = stopShare;
  $('bShare').textContent = 'Parar de compartilhar';
  note('Você está transmitindo para ' + (Object.keys(users).length - 1) + ' pessoa(s). Marque "Compartilhar áudio" na janela do navegador para o som chegar também. Netflix e similares costumam mostrar tela preta.');
  Object.keys(users).forEach(id => id !== sock.id && call(id));
};
function stopShare() {
  if (!stream) return;
  stream.getTracks().forEach(t => t.stop()); stream = null;
  Object.values(peers).forEach(p => p.close()); peers = {};
  fileCast = false; $('bCast').textContent = 'Transmitir arquivo para todos';
  sock.emit('share-stop'); $('bShare').textContent = 'Compartilhar tela'; note('');
}
</script>
